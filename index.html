<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>পুশ ডেমো</title>
<meta name="theme-color" content="#0B1020">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="toast"><b id="t-title"></b><span id="t-body"></span></div>

<!-- লগইন -->
<section id="auth" class="auth" hidden>
  <div class="box">
    <h1>🔔 পুশ ডেমো</h1>
    <p class="sub">লগইন করে নোটিফিকেশন চালু করুন</p>
    <div class="tabs"><button id="tab-login" class="on" data-act="mode" data-m="login">লগইন</button><button id="tab-reg" data-act="mode" data-m="reg">নতুন অ্যাকাউন্ট</button></div>
    <label class="fld" id="f-name" hidden><input id="a-name" type="text" placeholder="আপনার নাম" autocomplete="name"></label>
    <label class="fld"><input id="a-email" type="email" placeholder="ইমেইল" autocomplete="username"></label>
    <label class="fld"><input id="a-pass" type="password" placeholder="পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)" autocomplete="current-password"></label>
    <button class="btn" id="a-btn" data-act="auth">লগইন</button>
    <p class="err" id="a-err"></p>
  </div>
</section>

<!-- হোম -->
<main id="home" class="wrap" hidden>
  <div class="top">
    <div class="brand">🔔 পুশ ডেমো<small id="who"></small></div>
    <button class="ic" data-act="logout" aria-label="লগআউট">⎋</button>
  </div>

  <div class="card">
    <h3>পুশ নোটিফিকেশন</h3>
    <div class="row"><span>ব্রাউজার সমর্থন</span><b class="pill wait" id="s-sup">…</b></div>
    <div class="row"><span>অনুমতি</span><b class="pill wait" id="s-perm">…</b></div>
    <div class="row"><span>ডিভাইস টোকেন</span><b class="pill wait" id="s-tok">…</b></div>
    <button class="btn" id="p-on" data-act="pushOn">নোটিফিকেশন চালু করুন</button>
    <button class="btn red" id="p-off" data-act="pushOff" hidden>নোটিফিকেশন বন্ধ করুন</button>
    <button class="btn alt" id="i-btn" data-act="install" hidden>📲 অ্যাপ হিসেবে ইনস্টল করুন</button>
    <p class="err" id="p-err"></p>
    <p class="hint">অ্যাপ বন্ধ থাকলেও বার্তা পেতে "চালু করুন" চাপুন। iPhone এ আগে সাইটটা "Add to Home Screen" করে ইনস্টল করতে হয়।</p>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><h3 style="margin:0">আপনার বার্তা</h3><button class="btn alt sm" data-act="readAll">সব পড়া হয়েছে</button></div>
    <div id="list"></div>
  </div>
</main>

<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
